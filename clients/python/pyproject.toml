[project]
name = "edgf-client"
version = "0.1.0"
description = "Data Plane から Governance Control Plane を呼ぶクライアント (認証、再試行、Problem Details の型付き例外)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["edgf_client*"]
