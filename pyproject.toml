[project]
name = "edgf"
version = "0.2.0"
description = "Enterprise Data Governance Framework - Governance Control Plane"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "alembic>=1.13",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
otel = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-cov>=5.0"]
e2e = ["playwright>=1.48"]  # UI の E2E テスト専用。本番の依存には含めない

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["edgf*"]

[tool.setuptools.package-data]
"edgf.migrations" = ["script.py.mako"]
"edgf.ui" = ["static/*", "static/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: 実ブラウザの E2E テスト (EDGF_E2E=1 のときだけ収集する)"]
pythonpath = ["."]

[tool.coverage.run]
source = ["edgf"]
