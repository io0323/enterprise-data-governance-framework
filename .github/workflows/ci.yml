name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - name: マイグレーションの往復
        env:
          EDGF_DATABASE_URL: sqlite:///./ci-migrations.db
        run: python scripts/verify_migrations.py
      - name: pytest
        run: pytest -q --cov=edgf/services --cov-fail-under=95

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edgf_ci
          POSTGRES_USER: edgf
          POSTGRES_PASSWORD: edgf-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edgf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: edgf-ci-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - name: マイグレーションの往復
        env:
          EDGF_DATABASE_URL: postgresql+psycopg://edgf:edgf-ci-only@localhost:5432/edgf_ci
        run: python scripts/verify_migrations.py
      - name: pytest
        env:
          EDGF_TEST_DATABASE_URL: postgresql+psycopg://edgf:edgf-ci-only@localhost:5432/edgf_ci
          EDGF_REQUIRE_DIALECT: postgresql  # 接続先を間違えて SQLite で素通りしないようにする
          PGTZ: Asia/Tokyo                  # セッションのタイムゾーンに依存しないことも確認する
        run: pytest -q --cov=edgf/services --cov-fail-under=95

  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,e2e]"
      - run: playwright install --with-deps chromium
      - name: UI の E2E (ローカルの署名鍵で IdP を模す)
        env:
          EDGF_E2E: "1"
        run: pytest -q tests/e2e

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[postgres,security]"
      # pip-audit は深刻度を出さないので、既知の脆弱性はすべて失敗にする。誤検知の除外は下に理由を書いて --ignore-vuln で指定する
      - name: 依存関係の脆弱性 (pip-audit)
        run: pip-audit --skip-editable
      # 深刻度 High 以上で失敗する。誤検知はコードに # nosec <ID> と理由を書いて除外する
      - name: 静的解析 (bandit)
        run: bandit -q -r edgf scripts --severity-level high
