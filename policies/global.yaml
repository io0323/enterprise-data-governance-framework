# Global Policy (§15 Federated Governance)
# Data Governance Committee が承認・管理する全ドメイン共通ポリシー。
# ドメインポリシーは追加のみ可能で、Global Policy の緩和・上書きは不可。
version: 1
scope: global
policies:
  - id: GOV-001
    name: Owner/Steward必須
    design_ref: "§4 Data Ownership"
    severity: critical
    check: {type: required_fields, fields: [owner, steward]}

  - id: GOV-002
    name: 最小Business Metadata
    design_ref: "§6.3 Metadata First"
    severity: high
    check: {type: required_fields, fields: [description, domain]}

  - id: SEC-001
    name: 暗号化必須
    design_ref: "§11 Encryption"
    severity: critical
    check: {type: required_controls, controls: [encryption_at_rest, encryption_in_transit]}

  - id: SEC-002
    name: 高機密データのマスキング
    design_ref: "§11 Masking"
    severity: high
    when: {sensitivity: [confidential, restricted]}
    check: {type: required_controls, controls: [masking]}

  - id: PRV-001
    name: PIIは機密度Confidential以上
    design_ref: "§12 PII"
    severity: critical
    when: {contains_pii: true}
    check: {type: field_in, field: sensitivity, values: [confidential, restricted]}

  - id: PRV-002
    name: PIIは保持期間必須
    design_ref: "§10.2 / §12 Retention"
    severity: high
    when: {contains_pii: true}
    check: {type: required_fields, fields: [retention_days]}

  - id: PRV-003
    name: 匿名化はk-匿名性の基準を満たすこと
    design_ref: "§12 Anonymization"
    severity: critical
    check: {type: anonymization_k}

  - id: PRV-004
    name: 仮名化は鍵の分離保管が必須で個人データのまま扱う
    design_ref: "§12 Pseudonymization"
    severity: critical
    check: {type: pseudonymization_controls}

  - id: PRV-005
    name: PIIカラムは処理目的と法的根拠が必須
    design_ref: "§12 PII"
    severity: medium  # 既存資産の Certification を止めないよう medium とする (是正は Issue で追跡)
    when: {contains_pii: true}
    check: {type: pii_columns_documented}

  - id: MDM-001
    name: マスタ資産はエンティティ定義とSurvivorshipルールが必須
    design_ref: "§8 Master Data Management"
    severity: high
    when: {data_class: [master]}
    check: {type: mdm_entity_defined}

  - id: QLT-001
    name: CDEは品質ルール必須
    design_ref: "§5.2 Critical Data Element"
    severity: high
    when: {is_cde: true}
    check: {type: min_quality_rules, count: 1}

  - id: QLT-002
    name: CDEは鮮度SLA必須
    design_ref: "§5 Timeliness"
    severity: medium
    when: {is_cde: true}
    check: {type: required_fields, fields: [freshness_sla_hours]}

  - id: LIN-001
    name: 派生データはリネージ必須
    design_ref: "§9 Data Lineage"
    severity: high
    when: {data_class: [analytical, ai]}
    check: {type: has_upstream_lineage}

  - id: AI-001
    name: AI学習データの承認
    design_ref: "§14 Training Data"
    severity: critical
    when: {data_class: [ai]}
    check: {type: ai_training_approved}  # controls の自己申告では合格にしない。TrainingApproval の記録で判定する

  - id: AI-002
    name: AI資産の実効機密度は宣言値以下であること(上流から継承)
    design_ref: "§14 Embedding Data / Vector Data"
    severity: critical
    when: {data_class: [ai]}
    check: {type: ai_inheritance}

  - id: AI-003
    name: RAGコーパスの構成元はCertifiedの資産に限る
    design_ref: "§14 RAG Data"
    severity: high
    when: {ai_kind: [rag_corpus]}
    check: {type: ai_rag_certified_sources}

  - id: AI-004
    name: PIIを含む元からのEmbedding/Vectorは仮名化以上が必須
    design_ref: "§14 Embedding Data"
    severity: critical
    when: {ai_kind: [vector_index, embedding_set]}
    check: {type: ai_embedding_protected}

  # §15 Data Product の出荷基準 (DATSIS)。すべて合格しないと Product を published にできない
  - id: MESH-001
    name: Discoverable(Catalogに登録済みで説明と用語がある)
    design_ref: "§15 Data Product"
    severity: high
    target: product
    check: {type: mesh_discoverable}

  - id: MESH-002
    name: Addressable(すべてのOutput PortにアドレスURIがある)
    design_ref: "§15 Data Product"
    severity: high
    target: product
    check: {type: mesh_addressable}

  - id: MESH-003
    name: Trustworthy(Contractが公開済みで品質SLAを満たし資産がCertified)
    design_ref: "§15 Data Product"
    severity: high
    target: product
    check: {type: mesh_trustworthy}

  - id: MESH-004
    name: Self-describing(全カラムと Product に説明があり Owner がいる)
    design_ref: "§15 Data Product"
    severity: high
    target: product
    check: {type: mesh_self_describing}

  - id: MESH-005
    name: Interoperable(CDMに準拠しIDとReference Dataの参照が標準に沿う)
    design_ref: "§15 Standardization"
    severity: high
    target: product
    check: {type: mesh_interoperable, column_name_pattern: "^[a-z][a-z0-9_]*$"}

  - id: MESH-006
    name: Secure(重大度high/criticalのポリシーに合格している)
    design_ref: "§15 Data Product"
    severity: high
    target: product
    check: {type: mesh_secure}

  - id: CAT-001
    name: Glossary用語との紐付け
    design_ref: "§6.2 Glossary"
    severity: low
    when: {is_cde: true}
    check: {type: glossary_linked}
