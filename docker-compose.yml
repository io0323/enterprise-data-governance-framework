services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edgf
      POSTGRES_USER: edgf
      POSTGRES_PASSWORD: ${EDGF_DB_PASSWORD:-edgf-local-only}
    volumes: [edgf-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgf"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      EDGF_DATABASE_URL: postgresql+psycopg://edgf:${EDGF_DB_PASSWORD:-edgf-local-only}@db:5432/edgf
      # 認証の既定は jwt (OIDC)。未設定なら API は起動時に停止する (fail fast)。
      # ローカル開発: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
      EDGF_ENV: ${EDGF_ENV:-production}
      EDGF_AUTH_MODE: jwt
      EDGF_OIDC_ISSUER: ${EDGF_OIDC_ISSUER:-}
      EDGF_OIDC_AUDIENCE: ${EDGF_OIDC_AUDIENCE:-}
      EDGF_OIDC_JWKS_URL: ${EDGF_OIDC_JWKS_URL:-}
      EDGF_CLAIM_SUBJECT: ${EDGF_CLAIM_SUBJECT:-sub}
      EDGF_CLAIM_ROLES: ${EDGF_CLAIM_ROLES:-roles}
      EDGF_ROLE_MAP: ${EDGF_ROLE_MAP:-}
      # §12 subject_ref の HMAC 鍵。production で未設定なら起動しない
      EDGF_SUBJECT_KEY: ${EDGF_SUBJECT_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:  # readiness: DB 疎通・スキーマ最新・ポリシー有効 (§19)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      retries: 6
volumes:
  edgf-pg: {}
