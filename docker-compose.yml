services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edgf
      POSTGRES_USER: edgf
      POSTGRES_PASSWORD: ${EDGF_DB_PASSWORD:-edgf-local-only}
    volumes: [edgf-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgf"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      EDGF_DATABASE_URL: postgresql+psycopg://edgf:${EDGF_DB_PASSWORD:-edgf-local-only}@db:5432/edgf
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:  # readiness: DB 疎通・スキーマ最新・ポリシー有効 (§19)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      retries: 6
volumes:
  edgf-pg: {}
